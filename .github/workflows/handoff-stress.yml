name: Hand-off stress (temporary)

on:
  pull_request:

permissions:
  contents: read

jobs:
  stress:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        round: [1, 2, 3, 4]
        code: [new, old]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Use the old hand-off code and test (comparison)
        if: matrix.code == 'old'
        shell: bash
        run: |
          git fetch --depth=1 origin main
          git checkout FETCH_HEAD -- src/printview3d/single_instance.py tests/test_single_instance.py
      - run: pip install -r requirements.txt -r requirements-build.txt -c requirements-build-lock.txt
      - name: Full test suite, 5 times in a row (as in the build)
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python tools/i18n.py compile && python tests/make_samples.py
          fails=0
          for i in 1 2 3 4 5; do python -m pytest -q -p no:cacheprovider tests >log.txt 2>&1 || { fails=$((fails+1)); grep -E "FAILED|hand-over|Error" log.txt | head -20; }; tail -1 log.txt; done
          echo "::notice title=Full suite ${{ matrix.code }} code round ${{ matrix.round }}::$fails of 5 full runs failed"
          test $fails -eq 0
