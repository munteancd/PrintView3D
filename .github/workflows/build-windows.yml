name: Build Windows app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Read version
        id: version
        shell: bash
        run: |
          v=$(python -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('src/printview3d/__init__.py').read()).group(1))")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Version $v"

      - name: Run tests
        run: |
          python tests/make_samples.py
          python -m pytest -q tests

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --clean printview3d.spec

      - name: Smoke test (render a sample to an image)
        # CI machines have no real GPU; never let this step hang or fail the build.
        continue-on-error: true
        timeout-minutes: 3
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\PrintView3D\PrintView3D.exe" -ArgumentList 'tests\data\cylinder.gcode','--screenshot','smoke.png' -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); Write-Warning "Smoke test timed out (no GPU on CI)" }
          if (Test-Path smoke.png) { Write-Host "Smoke test OK" } else { Write-Warning "No image produced (CI has no OpenGL)" }

      - name: Package
        shell: pwsh
        run: |
          Copy-Item install_windows.bat, uninstall_windows.bat, LICENSE dist\PrintView3D\
          Copy-Item -Recurse examples dist\PrintView3D\examples
          Compress-Archive -Path dist\PrintView3D\* -DestinationPath PrintView3D-windows.zip
          # Release notes: download instructions + this version's CHANGELOG entry
          $v = "${{ steps.version.outputs.version }}"
          $log = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($log, "(?s)## $([regex]::Escape($v))\s*(.*?)(?=\n## |\z)")
          $notes = "## Download`n`nDownload **PrintView3D-windows.zip** below, extract it and run **install_windows.bat**. No Python needed. See the [README](https://github.com/${{ github.repository }}#install) for details.`n`n## What's new`n`n" + $m.Groups[1].Value.Trim()
          Set-Content -Path release_notes.md -Value $notes -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: PrintView3D-windows
          path: PrintView3D-windows.zip

      # A release is published automatically when the version in
      # src/printview3d/__init__.py is new (pushed to main), or when a v* tag is pushed.
      - name: Publish release
        if: >-
          startsWith(github.ref, 'refs/tags/v') ||
          (github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.version.outputs.released == 'false')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          target_commitish: ${{ github.sha }}
          name: PrintView3D ${{ steps.version.outputs.version }}
          body_path: release_notes.md
          files: PrintView3D-windows.zip
