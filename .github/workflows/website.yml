# The website https://sevagjb.github.io/PrintView3D/ , built from docs/ with MkDocs.
# Pull requests only check that it builds (no broken links); main also publishes it.
# One-time setup by the repository owner: Settings -> Pages -> Source: "GitHub Actions".
name: Website

on:
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", "requirements-website.txt", ".github/workflows/website.yml"]
  pull_request:
    paths: ["docs/**", "mkdocs.yml", "requirements-website.txt", ".github/workflows/website.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build (strict, so a broken link or missing page fails)
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: |
          pip install -r requirements-website.txt
          mkdocs build --strict
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pages: write        # publish to GitHub Pages
      id-token: write     # prove to Pages that this run is from this repository
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
